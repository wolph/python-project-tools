[build-system]
build-backend = 'uv_build'
requires = ['uv_build>=0.11,<1']

[project]
name = 'python-project-tools'
version = '2.1.0'
description = 'Release, signing and verification tooling for Python packages'
readme = 'README.md'
requires-python = '>=3.10'
license = 'BSD-3-Clause'
license-files = ['LICENSE']
authors = [{ name = 'Rick van Hattem', email = 'wolph@wol.ph' }]
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development :: Build Tools',
    'Typing :: Typed',
]
dependencies = [
    'packaging>=23',
    'tomli>=2; python_version < "3.11"',
]

[project.urls]
homepage = 'https://github.com/WoLpH/python-project-tools/'
repository = 'https://github.com/WoLpH/python-project-tools/'

[project.scripts]
ppt = 'python_project_tools.cli:main'

[project.optional-dependencies]
tests = ['pytest>=8', 'pytest-cov>=5']

[dependency-groups]
dev = ['python-project-tools[tests]', 'ruff', 'ty', 'tox-uv', 'tox>=4.21']

[tool.uv.build-backend]
module-name = 'python_project_tools'
module-root = ''

[tool.pytest.ini_options]
addopts = ['--strict-config', '--strict-markers', '-ra', '-p', 'no:cacheprovider']
testpaths = ['tests']
xfail_strict = true
filterwarnings = ['error']

[tool.ty.environment]
python-version = '3.10'

[tool.ty.src]
include = ['python_project_tools', 'tests']
